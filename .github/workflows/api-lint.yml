name: API Lint

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-lint.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-lint.yml"

defaults:
  run:
    working-directory: api

jobs:
  checkstyle:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B spotless:check
