spring.application.name=travelonthegravel
app.version=@project.version@

# Hibenate + liquibase (connection cofigured via envs)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Locale
spring.web.locale=pl
spring.web.locale-resolver=fixed

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:no-reply@travelonthegravel.local}
app.mail.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# Password reset
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:1h}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=places-search,places-country
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Nominatim API
spring.http.serviceclient.nominatim.base-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
spring.http.serviceclient.nominatim.default-header.User-Agent=${NOMINATIM_USER_AGENT:TravelOnTheGravel (https://github.com/sgorski00/TravelOnTheGravel)}
spring.http.serviceclient.nominatim.connect-timeout=${NOMINATIM_TIMEOUT:5s}
spring.http.serviceclient.nominatim.read-timeout=${NOMINATIM_TIMEOUT:5s}
app.nominatim.min-interval=1s
