<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.password-reset.title}"></title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
    <h2 th:text="#{email.password-reset.title}"></h2>
    <p th:text="#{email.password-reset.intro}"></p>
    <p>
        <a th:href="${resetUrl}" th:text="#{email.password-reset.button}"
           style="display: inline-block; padding: 10px 16px; background: #2e7d32; color: #fff; text-decoration: none; border-radius: 4px;"></a>
    </p>
    <p><span th:text="#{email.password-reset.link-hint}"></span><br><span th:text="${resetUrl}"></span></p>
    <p th:text="#{email.password-reset.expiry(${expiryMinutes})}"></p>
</body>
</html>
